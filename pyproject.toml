[build-system]
requires = ["setuptools>=82.0.1", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stealth-requests"
version = "2.0.6"
description = "Undetected web-scraping & seamless HTML parsing in Python!"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jacob Padilla", email = "stealth-requests@jacobpadilla.com" }
]
keywords = ["HTTP", "requests", "scraping", "browser"]
urls = { "Homepage" = "https://github.com/jpjacobpadilla/Stealth-Requests" }

dependencies = ["curl_cffi>=0.15.0"]

[project.optional-dependencies]
parsers = [
    "lxml>=6.1.1",
    "html2text>=2025.4.15",
    "beautifulsoup4>=4.15.0",
]

[tool.setuptools.packages.find]
include = ["stealth_requests"]

[tool.setuptools.package-data]
stealth_requests = ["user_agents.json"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I", "TID"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[dependency-groups]
dev = [
    "lxml>=6.1.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "notebook>=7.5.7",
    "ruff>=0.15.18",
]
